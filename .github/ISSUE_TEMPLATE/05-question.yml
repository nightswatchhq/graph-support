name: A question
description: Not obviously broken, you just want to know how something works or what the right approach is.
title: "[question] "
labels: ["status/triage", "kind/question"]
body:
  - type: markdown
    attributes:
      value: |
        Delegators, curators, developers and the merely curious are all welcome here.
        There is no such thing as too basic a question. The people who look foolish in
        this ecosystem are the ones who guessed and shipped it.

        **Do not paste API keys or private keys.**
  - type: textarea
    id: question
    attributes:
      label: The question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: What you are trying to do
      description: The underlying goal, not just the immediate step. It is common for the best answer to be a different approach entirely.
  - type: textarea
    id: found
    attributes:
      label: What you have already read or tried
      description: Saves us sending you somewhere you have already been.
